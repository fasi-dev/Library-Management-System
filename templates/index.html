<!DOCTYPE html>
<html>
<head>
    <title>Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>📚 Books in Library</h1>

<!-- ✅ THIS IS THE IMPORTANT BUTTON -->
<a href="/add">➕ Add New Book</a>

<br><br>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Genre</th>
        <th>Action</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book[0] }}</td>
        <td>{{ book[1] }}</td>
        <td>{{ book[2] }}</td>
        <td>{{ book[3] }}</td>
    </tr>
<td>
    <a href="/edit/{{ book[0] }}">Edit</a> |
    <a href="/delete/{{ book[0] }}">Delete</a>
</td>
    {% endfor %}
</table>

</body>
</html>
