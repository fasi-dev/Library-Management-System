{% extends "base.html" %}
{% block title %}Add Book · Library{% endblock %}

{% block content %}

<h1>Add New Book</h1>

<form method="POST" class="form-card">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="e.g. Clean Code" required>
    </div>

    <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" placeholder="e.g. Robert C. Martin" required>
    </div>

    <div class="form-group">
        <label for="genre">Genre</label>
        <input type="text" id="genre" name="genre" placeholder="e.g. Software Engineering" required>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add Book</button>
        <a href="/" class="btn btn-ghost">Cancel</a>
    </div>
</form>

{% endblock %}
